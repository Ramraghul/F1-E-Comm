services:
  - type: web
    name: shopswift-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build -w shared && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_PREFIX
        value: /api/v1
      - key: ENABLE_SWAGGER
        value: true
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_RACETEAM_PASSWORD
        sync: false
      - key: SEED_CUSTOMER_PASSWORD
        sync: false
